# Bootstrap HTTP only — use before certbot exists, then switch to mahjong-front.conf
# certbot: sudo certbot --nginx -d mahjong.irfan-f.com

server {
    listen 80;
    listen [::]:80;
    server_name mahjong.irfan-f.com;

    root /var/www/mahjong-frontend;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
