# TLS vhost for mahjong.irfan-f.com
# Requires cert: /etc/letsencrypt/live/mahjong.irfan-f.com/ (certbot)
#
# Install (VPS as irf) — site name on VPS is often mahjong-front:
#   sudo cp deploy/nginx/mahjong-front.conf /etc/nginx/sites-available/mahjong-front
#   sudo ln -sf /etc/nginx/sites-available/mahjong-front /etc/nginx/sites-enabled/mahjong-front
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mahjong.irfan-f.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mahjong.irfan-f.com;

    ssl_certificate /etc/letsencrypt/live/mahjong.irfan-f.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahjong.irfan-f.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mahjong-frontend;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
